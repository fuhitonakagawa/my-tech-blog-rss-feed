name: Generate feeds and site

on:
  push:
    branches: [ main ]
  schedule:
    # UTC指定。毎日24時間、毎時0分に巡回する。日次統計は前日までを対象とする。
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-feed
  cancel-in-progress: true

jobs:
  # ビルドにはソース参照と翻訳用OIDC、デプロイには公開先への書き込みを許可する
  build:
    name: Build Site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/restore-published-feeds
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - uses: ./.github/actions/setup-translation
        with:
          allow-aws: 'true'
      - uses: ./.github/actions/restore-feed-cache
      - run: npm run cache-prune
      - run: npm run feed-generate
      - run: npm run site-prepare
      - run: npm run site-build
      - uses: ./.github/actions/save-feed-cache
      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: ./public
          retention-days: 1

  deploy:
    name: Deploy Site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ./public
      # 公開先の一時的なエラーには15秒、30秒の間隔で最大3回試行し、全試行失敗時はジョブを失敗させる
      - name: Deploy site (attempt 1)
        id: deploy_first
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      - name: Wait before second deployment attempt
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15
      - name: Deploy site (attempt 2)
        id: deploy_second
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
      - name: Wait before third deployment attempt
        if: steps.deploy_second.outcome == 'failure'
        run: sleep 30
      - name: Deploy site (attempt 3)
        if: steps.deploy_second.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
