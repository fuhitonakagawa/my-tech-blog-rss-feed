minimum_pre_commit_version: '4.6.2'
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: biome
        name: Biome
        entry: node node_modules/@biomejs/biome/bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true --
        language: system
        types: [text]
        require_serial: true
      - id: secretlint
        name: Secretlint
        entry: node node_modules/secretlint/bin/secretlint.js --no-glob --
        language: system
        types: [text]
        require_serial: true
